name: Build site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download cabe-game
        run: |
          curl -fsSL https://m42-prod-cabe-game.s3-us-west-2.amazonaws.com/cabe-game.zip -o cabe-game.zip
          unzip -q cabe-game.zip
          mv cabe-game public/game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
